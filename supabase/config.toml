# Supabase configuration for local development and CI testing
project_id = "clipper-helper"

[api]
port = 54321
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["clipperhelper://auth/callback", "https://clipper-bridge.vercel.app"]
jwt_expiry = 3600
enable_signup = true

[storage]
file_size_limit = "50MiB"
