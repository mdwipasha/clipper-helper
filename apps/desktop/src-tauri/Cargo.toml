[package]
name = "clipper-helper-desktop"
version = "0.1.0"
description = "ClipperHelper Desktop Core"
edition = "2021"

[workspace]
members = [
    ".",
    "crates/fake-sidecar",
    "crates/harness-supervisor",
]

[lib]
name = "clipper_helper_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
tauri = { version = "=2.12.7", features = ["protocol-asset"] }
tauri-plugin-opener = "=2.7.3"
tauri-plugin-dialog = "=2.8.4"
specta = "=2.0.0-rc.20"
specta-typescript = "=0.0.7"
tauri-specta = { version = "=2.0.0-rc.20", features = ["derive", "javascript", "typescript"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
thiserror = "=2.0.11"
tracing = "=0.1.41"
tracing-subscriber = "=0.3.19"
regex = "=1.13.2"
dunce = "=1.0.5"
rusqlite = { version = "=0.37.0", features = ["bundled"] }
tokio = { version = "=1.54.1", features = ["rt", "process", "io-util", "sync", "time", "macros"] }
tokio-util = { version = "=0.7.20", features = ["codec"] }
ed25519-dalek = { version = "=2.1.1", default-features = false, features = ["std", "fast"] }
hex = "=0.4.3"
sha2 = "=0.10.8"
reqwest = { version = "=0.12.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "=0.3.31"
zip = { version = "=9.8.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
uuid = { version = "=1.18.1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.59.0", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_SystemInformation",
    "Win32_System_Power",
    "Win32_System_Registry",
] }

[dev-dependencies]
tempfile = "=3.15.0"
