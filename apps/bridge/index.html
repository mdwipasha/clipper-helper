<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="clipper-bridge-protocol" content="1">
  <meta name="clipper-bridge-version" content="1.0.0">
  <title>ClipperHelper Embed Bridge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="bridge-container">
    <div id="player-wrapper">
      <div id="player"></div>
    </div>

    <div id="loading-overlay">
      <div class="spinner"></div>
      <div class="loading-text">Memuat pemutar video…</div>
    </div>

    <div id="error-overlay" class="hidden">
      <div class="error-card">
        <div class="error-title" id="error-title">Pratinjau tidak tersedia</div>
        <div class="error-message" id="error-message">Pemutaran embed dibatasi atau tidak dapat dimuat.</div>
        <div class="error-code" id="error-code"></div>
      </div>
    </div>
  </div>

  <script src="bridge.js"></script>
</body>
</html>
