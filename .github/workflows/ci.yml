name: CI

on:
  push:
    branches: [main, master, 'feature/**']
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, Test & Build (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check code formatting
        run: pnpm run format

      - name: Run ESLint
        run: pnpm run lint

      - name: TypeScript typecheck
        run: pnpm run typecheck

      - name: Run Vitest unit & security guard tests
        run: pnpm run test

      - name: Check Rust formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all --check

      - name: Rust Clippy
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust Unit Tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Build Tauri Desktop App (Unsigned)
        run: pnpm --filter @clipper-helper/desktop tauri build --no-bundle

      - name: Upload Desktop Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: clipper-helper-desktop-binary
          path: apps/desktop/src-tauri/target/release/clipper-helper-desktop.exe
          if-no-files-found: error
