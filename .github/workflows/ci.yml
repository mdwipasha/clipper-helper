name: CI

on:
  push:
    branches: [main, master, 'feature/**']
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Security & License Audit (Report-Only)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.16.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create reports directory
        shell: powershell
        run: New-Item -ItemType Directory -Force -Path audit-reports

      - name: Run pnpm audit (report-only)
        shell: powershell
        run: |
          pnpm audit > audit-reports/pnpm-audit.txt 2>&1
          $global:LASTEXITCODE = 0
          Write-Host "pnpm audit completed (report saved to audit-reports/pnpm-audit.txt)"

      - name: Run license audit (report-only)
        shell: powershell
        run: |
          pnpm licenses list > audit-reports/license-audit.txt 2>&1
          $global:LASTEXITCODE = 0
          Write-Host "license audit completed (report saved to audit-reports/license-audit.txt)"

      - name: Install and run cargo audit (report-only)
        shell: powershell
        run: |
          cargo install --locked cargo-audit
          cargo audit --file apps/desktop/src-tauri/Cargo.lock > audit-reports/cargo-audit.txt 2>&1
          $global:LASTEXITCODE = 0
          Write-Host "cargo audit completed (report saved to audit-reports/cargo-audit.txt)"

      - name: Upload Audit Reports Artifact
        uses: actions/upload-artifact@v4
        with:
          name: audit-reports
          path: audit-reports/

  check:
    name: Lint, Test & Build (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.16.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Tauri version parity (tauri info)
        shell: powershell
        run: |
          $info = pnpm --filter @clipper-helper/desktop tauri info 2>&1 | Out-String
          Write-Host $info
          if ($info -match '\(outdated|\(mismatch') {
            Write-Error "Tauri package/crate version mismatch detected!"
            exit 1
          }

      - name: Check code formatting
        run: pnpm run format

      - name: Run ESLint
        run: pnpm run lint

      - name: TypeScript typecheck
        run: pnpm run typecheck

      - name: Run Vitest unit & security guard tests
        run: pnpm run test

      - name: Check Rust formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all --check

      - name: Rust Clippy
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust Unit Tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --all

      - name: Build Tauri Desktop App (Release, Unsigned)
        run: pnpm --filter @clipper-helper/desktop tauri build --no-bundle

      - name: Release Binary Smoke Test
        shell: powershell
        run: |
          $binPath = "apps/desktop/src-tauri/target/release/clipper-helper-desktop.exe"
          if (!(Test-Path $binPath)) {
            Write-Error "Release binary not found at $binPath"
            exit 1
          }
          $item = Get-Item $binPath
          Write-Host "Binary exists: $($item.FullName) ($($item.Length) bytes)"
          if ($item.Length -lt 1000000) {
            Write-Error "Binary size is unexpectedly small ($($item.Length) bytes)"
            exit 1
          }
          $content = [System.IO.File]::ReadAllText($item.FullName, [System.Text.Encoding]::GetEncoding("ISO-8859-1"))
          if ($content.Contains("dev_run_fake_sidecar") -or $content.Contains("dev_get_system_info")) {
            Write-Error "Security guard violation: dev commands detected in release binary!"
            exit 1
          }
          Write-Host "Release binary verified: strict isolation confirmed (zero dev commands present)."

      - name: Upload Desktop Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: clipper-helper-desktop-binary
          path: apps/desktop/src-tauri/target/release/clipper-helper-desktop.exe
          if-no-files-found: error
